server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: data-push-manager
  
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
#        driver-class-name: com.kingbase8.Driver
#        url: jdbc:kingbase8://127.0.0.1:54321/sjts?&useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&reWriteBatchedInserts=true
#        username: system
#        password: 123

      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://localhost:3306/data_push_manager?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
      username: root
      password: 123
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      test-while-idle: true
      validation-query: SELECT 1
      filter:
        stat:
          enabled: true
          log-slow-sql: true
          slow-sql-millis: 3000

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.datapush.manager.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: datapush_manager_secret_key_2024
  expiration: 86400000

# 日志配置
logging:
  level:
    com.datapush.manager: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
